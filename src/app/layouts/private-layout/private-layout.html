<div class="layout-container">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="user-profile">
        <img [src]="userAvatar" alt="Avatar" class="user-avatar">
        <div class="user-info">
          <span class="brand-name">VitalCo</span>
          <span class="user-name">{{ userName }}</span>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/sistema/progreso-paciente" routerLinkActive="active" class="nav-item">
        <img src="/Images/iconos/iconoSistemas/image%2021.png" alt="Progreso" class="nav-icon">
        <span>Progreso</span>
      </a>

      <a routerLink="/sistema/perfil-paciente" routerLinkActive="active" class="nav-item">
        <img src="/Images/iconos/iconoSistemas/image%2022.png" alt="Perfil" class="nav-icon">
        <span>Perfil</span>
      </a>

      <a routerLink="/sistema/receta-paciente" routerLinkActive="active" class="nav-item">
        <img src="/Images/iconos/iconoSistemas/user-multiple.png" alt="Recetas" class="nav-icon">
        <span>Recetas</span>
      </a>

      <div *ngIf="isPremium" class="citas-container">
        <a (click)="toggleCitas()" class="nav-item citas-parent" [class.expanded]="citasExpanded">
          <img src="/Images/iconos/iconoSistemas/image%2054.png" alt="Citas" class="nav-icon">
          <span>Citas</span>
          <svg class="chevron-icon" [class.rotated]="citasExpanded" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>

        <div class="citas-submenu" [class.show]="citasExpanded">
          <a routerLink="/sistema/citas/programar" routerLinkActive="active" class="nav-item sub-link">
            <span>Programar Cita</span>
          </a>
          <a routerLink="/sistema/citas/listar" routerLinkActive="active" class="nav-item sub-link">
            <span>Listar</span>
          </a>
        </div>
      </div>

      <a routerLink="/sistema/cambiar-plan" routerLinkActive="active" class="nav-item">
        <img src="/Images/iconos/iconoSistemas/setting-01.png" alt="Cambiar Plan" class="nav-icon">
        <span>Cambiar Plan</span>
      </a>
    </nav>

    <button class="sidebar-logout" (click)="logout()">
      <img src="/Images/iconos/iconoSistemas/logout-03.png" alt="Salir" class="nav-icon">
      <span>Salir</span>
    </button>
  </aside>

  <main class="main-content">
    <div class="page-card" *ngIf="!hidePageCard">
      <router-outlet></router-outlet>
    </div>
    <router-outlet *ngIf="hidePageCard"></router-outlet>
  </main>
</div>
