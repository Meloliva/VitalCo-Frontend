<div class="recetas-container">
  <h2 class="titulo-recetas">Recetas</h2>

  <div class="recetas-lista">
    <div class="receta-card" *ngFor="let receta of recetasPaginadas">
      <div class="receta-content">
        <!-- Imagen -->
        <div class="receta-imagen">
          <img [src]="receta.foto || 'assets/default-recipe.jpg'" [alt]="receta.nombre">
        </div>

        <!-- Información -->
        <div class="receta-info">
          <h3 class="receta-nombre">{{ receta.nombre }}</h3>
          <p class="receta-descripcion">{{ receta.descripcion }}</p>

          <!-- Información nutricional -->
          <div class="receta-nutricion">
            <span class="nutricion-item">
              <mat-icon class="nutricion-icon">schedule</mat-icon>
              {{ receta.tiempo }} min
            </span>
            <span class="nutricion-item">
              <mat-icon class="nutricion-icon">local_fire_department</mat-icon>
              {{ receta.calorias }} cal
            </span>
            <span class="nutricion-item">
              <mat-icon class="nutricion-icon">fitness_center</mat-icon>
              {{ receta.proteinas }}g proteína
            </span>
            <span class="nutricion-item">
              <mat-icon class="nutricion-icon">bakery_dining</mat-icon>
              {{ receta.carbohidratos }}g carbohidratos
            </span>
          </div>
        </div>

        <!-- Botón de editar -->
        <div class="receta-acciones">
          <button class="btn-editar" (click)="editar(receta.idReceta)">
            Editar Receta
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Mensaje si no hay recetas -->
  <div *ngIf="dataSource.data.length === 0" class="sin-recetas">
    <p>No hay recetas registradas</p>
  </div>

  <!-- Paginador -->
  <div class="paginador-container" *ngIf="dataSource.data.length > 0">
    <mat-paginator
      [length]="dataSource.data.length"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 20]"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>
  </div>
</div>
