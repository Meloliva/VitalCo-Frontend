<div class="main-content-area">
  <div class="schedule-appointment-container wide-card">

    <h1 class="form-title">
      {{ esEdicion ? 'Reprogramar Cita' : 'Programar Cita' }}
    </h1>

    <div *ngIf="successMessage" class="alert alert-success" style="color: green; border: 1px solid green; padding: 10px; margin-bottom: 15px; border-radius: 5px; background: #f0fff4;">
      ✅ {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="alert alert-error" style="color: red; border: 1px solid red; padding: 10px; margin-bottom: 15px; border-radius: 5px; background: #fff5f5;">
      ❌ {{ errorMessage }}
    </div>

    <div *ngIf="isLoading && nutricionistas.length === 0" style="text-align: center; padding: 20px;">
      Cargando datos...
    </div>

    <form class="appointment-form" [formGroup]="appointmentForm" (ngSubmit)="onSubmit()" *ngIf="appointmentForm">

      <div class="form-group">
        <label for="dni">DNI <span class="required">*</span></label>
        <input type="text" id="dni" formControlName="dni" [class.input-error]="dni?.invalid && dni?.touched" />
      </div>

      <div class="form-group">
        <label for="nutritionist">Seleccionar Nutricionista <span class="required">*</span></label>
        <select id="nutritionist" formControlName="nutritionist" [class.input-error]="nutritionist?.invalid && nutritionist?.touched">
          <option [value]="null" disabled>Elige un nutricionista</option>
          <option *ngFor="let nutri of nutricionistas" [value]="nutri.id">
            {{ nutri.idusuario.nombre }} {{ nutri.idusuario.apellido }}
          </option>
        </select>
        <div class="error-text" *ngIf="nutritionist?.invalid && nutritionist?.touched">
          Selecciona un nutricionista.
        </div>
      </div>

      <div class="form-group date-time-group">
        <label>Fecha y Hora <span class="required">*</span></label>
        <div class="date-time-inputs">
          <div class="input-wrapper">
            <input type="date" formControlName="appointmentDate" [class.input-error]="appointmentDate?.invalid && appointmentDate?.touched" />
          </div>
          <div class="input-wrapper">
            <input type="time" formControlName="appointmentTime" [class.input-error]="appointmentTime?.invalid && appointmentTime?.touched" />
          </div>
        </div>
        <div class="error-text" *ngIf="(appointmentDate?.invalid && appointmentDate?.touched) || (appointmentTime?.invalid && appointmentTime?.touched)">
          Fecha y hora requeridas.
        </div>
      </div>

      <div class="form-group">
        <label for="description">Descripción <span class="required">*</span></label>
        <textarea id="description" rows="4" formControlName="description" [class.input-error]="description?.invalid && description?.touched"></textarea>
      </div>

      <div class="form-group">
        <label for="link">Link de reunión (Opcional)</label>
        <input type="text" id="link" formControlName="link" placeholder="https://zoom.us/..." />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-programar" [disabled]="appointmentForm.invalid || isLoading">
          <span *ngIf="!isLoading">
            {{ esEdicion ? 'Guardar Cambios' : 'Programar Cita' }}
          </span>
          <span *ngIf="isLoading">Procesando...</span>
        </button>
      </div>

    </form>
  </div>
</div>
