<div class="contenedor-principal">

  <div class="encabezado">
    <h2>Mis Citas Programadas</h2>

    <div class="filtros">
      <button [class.activo]="filtroActivo === 'hoy'" (click)="cargarHoy()">Hoy</button>
      <button [class.activo]="filtroActivo === 'manana'" (click)="cargarManana()">Mañana</button>
      <input type="date" (change)="cargarPorFecha($event)">
    </div>
  </div>

  <div *ngIf="loading" class="mensaje-estado">
    <div class="spinner"></div>
    <p>Cargando información...</p>
  </div>

  <div *ngIf="!loading && citas.length === 0" class="mensaje-estado">
    <p>No tienes citas programadas para esta fecha.</p>
  </div>

  <div class="grid-citas" *ngIf="!loading && citas.length > 0">

    <div *ngFor="let cita of citas" class="tarjeta-cita">
      <div class="tarjeta-header">
        <div class="info-nutri">
          <span class="etiqueta">Nutricionista</span>
          <h3>{{ getNombreNutricionista(cita.idNutricionista) }}</h3>
        </div>
        <div class="fecha-badge">
          {{ cita.dia }}
        </div>
      </div>

      <div class="tarjeta-body">
        <p class="hora">
          <i class="icono-reloj">⏰</i>
          {{ cita.hora }}
        </p>

        <p class="motivo">
          <strong>Motivo:</strong>
          {{ cita.descripcion || 'Sin descripción' }}
        </p>

        <div class="link-zoom" *ngIf="cita.link">
          <a [href]="cita.link" target="_blank">📹 Unirse a Zoom</a>
        </div>
      </div>

      <div class="tarjeta-footer">
        <button class="btn-reprogramar" (click)="reprogramar(cita)">Reprogramar</button>
        <button class="btn-eliminar" (click)="eliminar(cita)">Cancelar</button>
      </div>
    </div>

  </div>
</div>
