<!-- html -->
<!-- Archivo: `src/app/citas/listar-citas/listar-citas.html` -->
<div class="list-container">
  <div class="header">
    <h2 class="form-title">Citas</h2>
    <div style="display:flex; align-items:center; gap:8px;">
      <label class="date-header" title="Seleccionar fecha">
        <i class="fas fa-calendar-alt"></i>
        <input class="datepicker-hidden-input" type="date" [value]="(selectedDate | date:'yyyy-MM-dd')" (change)="onDateChange($event)">
        Fecha
      </label>
    </div>
  </div>

  <div class="tabs">
    <!-- Eliminado el botón "Por fecha" -->
    <button class="tab-button" [class.active]="tab==='hoy'" (click)="setTab('hoy')">Hoy</button>
    <button class="tab-button" [class.active]="tab==='manana'" (click)="setTab('manana')">Mañana</button>
  </div>

  <div *ngIf="isLoading" class="no-appointments">Cargando...</div>

  <div class="appointment-list" *ngIf="!isLoading">
    <div *ngFor="let app of paginatedAppointments" class="appointment-card" (click)="selectAppointment(app)" [class.selected]="app.id === (selectedAppointment?.id ?? null)">
      <div class="avatar">{{ app.avatarInitials }}</div>

      <div class="details">
        <div class="row-1">
          <h4>{{ app.patientName }}</h4>
          <span class="appointment-time">{{ app.time }}</span>
          <span class="meeting-type"><i class="icon-zoom"></i> {{ app.meetingType }}</span>
        </div>
        <div class="row-2">
          <div class="description-box">{{ app.description || 'Sin descripción' }}</div>
        </div>
      </div>

      <div class="actions">
        <button class="btn-join" (click)="joinMeeting($event, app.meetingLink, app)">Unirse</button>
      </div>
    </div>

    <div *ngIf="paginatedAppointments.length === 0" class="no-appointments">
      No hay citas para la selección.
    </div>

    <div class="footer-actions" *ngIf="citas.length > 0" style="margin-top:16px;">
      <button class="tab-button" (click)="changePage(-1)">Anterior</button>
      <span style="margin:0 12px;">Página {{currentPage}} / {{ Math.max(1, Math.ceil(citas.length / pageSize)) }}</span>
      <button class="tab-button" (click)="changePage(1)">Siguiente</button>
    </div>
  </div>
</div>
