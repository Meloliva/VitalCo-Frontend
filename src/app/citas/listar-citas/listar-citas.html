<div class="list-container">

  <!-- HEADER -->
  <div class="header">
    <h1 class="form-title">Citas</h1>

    <div class="date-header" (click)="picker.open()">
      <mat-form-field class="datepicker-hidden-input">
        <input
          matInput
          [matDatepicker]="picker"
          [(ngModel)]="selectedDate"
          (dateChange)="onDateChange($event)"
        />
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>

      <i class="fas fa-calendar-alt"></i>
      {{ selectedDate | date:'EEEE, d \'de\' MMMM \'de\' yyyy' | titlecase }}
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button
      class="tab-button"
      [class.active]="activeTab === 'hoy'"
      (click)="changeTab('hoy')">
      Hoy
    </button>
    <button
      class="tab-button"
      [class.active]="activeTab === 'mañana'"
      (click)="changeTab('mañana')">
      Mañana
    </button>
  </div>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="main-content">
    <div class="appointment-list">
      <div
        *ngFor="let app of paginatedAppointments"
        class="appointment-card"
        (click)="selectAppointment(app)"
        [class.selected]="app.id === selectedAppointment?.id">

        <div class="avatar">
          {{ app.avatarInitials }}
        </div>

        <div class="details">
          <div class="row-1">
            <h4>{{ app.patientName }}</h4>
            <span class="appointment-time">{{ app.time }}</span>
            <span class="meeting-type">{{ app.meetingType }}</span>
          </div>
          <div class="row-2">
            <div class="description-box">
              {{ app.description }}
            </div>
          </div>
        </div>

        <div class="actions">
          <button
            class="btn-join"
            (click)="joinMeeting($event, app.meetingLink)">
            Unirse
          </button>
        </div>
      </div>

      <div *ngIf="appointments.length === 0" class="no-appointments">
        <i class="fas fa-calendar-times" style="font-size: 32px; color: #d1d5db; margin-bottom: 12px;"></i>
        <p>No hay citas programadas para la fecha seleccionada.</p>
      </div>
    </div>
  </div>

  <!-- FOOTER ACTIONS -->
  <div class="footer-actions">
    <button
      class="btn-reprogramar"
      [disabled]="!selectedAppointment">
      <i class="fas fa-calendar-check" style="margin-right: 6px;"></i>
      Reprogramar
    </button>
    <button
      class="btn-cancel"
      (click)="cancelAppointment()"
      [disabled]="!selectedAppointment">
      <i class="fas fa-trash-alt" style="margin-right: 6px;"></i>
      Cancelar cita
    </button>
  </div>

  <!-- PAGINADOR -->
  <mat-paginator
    [length]="totalAppointments"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    (page)="paginateAppointments($event)"
    showFirstLastButtons
    aria-label="Select page of appointments"
    class="custom-paginator"
  >
  </mat-paginator>

</div>
